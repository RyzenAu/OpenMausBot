# Merges milind-soni/OpenMausBot main into a review branch on this fork.
# A conflict, a failed test, or a missing InstaBox guard stops the job.
# Nothing is force-pushed, merged, released, or installed.
name: Sync upstream InstaBox

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-instabox-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Merge upstream and open a review PR
    if: github.repository == 'RyzenAu/OpenMausBot'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main

      - name: Fetch upstream main
        run: |
          git remote add upstream https://github.com/milind-soni/OpenMausBot.git
          git fetch upstream main

      - name: Merge upstream without committing
        id: merge
        run: |
          set -euo pipefail
          branch="sync/instabox-${GITHUB_RUN_ID}"
          git checkout -b "$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          if git merge --no-ff --no-commit upstream/main; then
            if git diff --cached --quiet && git diff --quiet; then
              echo "state=uptodate" >> "$GITHUB_OUTPUT"
            else
              echo "state=clean" >> "$GITHUB_OUTPUT"
            fi
          else
            git diff --name-only --diff-filter=U | tee conflicts.txt
            git merge --abort
            echo "state=conflict" >> "$GITHUB_OUTPUT"
          fi

      - name: Already current
        if: success() && steps.merge.outputs.state == 'uptodate'
        run: echo "Upstream main is already in this fork. Nothing to review."

      - name: Stop on a merge conflict
        if: success() && steps.merge.outputs.state == 'conflict'
        run: |
          echo "::error::Upstream merge conflict. main was not changed. Resolve the files in conflicts.txt on a local branch."
          cat conflicts.txt
          exit 1

      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
        if: success() && steps.merge.outputs.state == 'clean'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: success() && steps.merge.outputs.state == 'clean'
        with:
          node-version: 24
          cache: pnpm

      - name: Check the InstaBox guard survived the merge
        if: success() && steps.merge.outputs.state == 'clean'
        run: |
          node --experimental-strip-types --input-type=module <<'EOF'
          import { readFileSync } from "node:fs";
          import { instaboxRetentionProblems, instaboxSyncDecision } from "./server/instabox-retention.ts";
          const retention = instaboxRetentionProblems({
            client: readFileSync("server/instabox.ts", "utf8"),
            updater: readFileSync("electron-builder.yml", "utf8"),
            release: readFileSync(".github/workflows/release.yml", "utf8"),
            linuxPackage: readFileSync("scripts/verify-linux-package.mjs", "utf8"),
            windowsPackage: readFileSync(".github/workflows/package-win.yml", "utf8"),
          });
          const decision = instaboxSyncDecision({ force: false, dirty: false, conflicts: [], testsFailed: false, retention });
          if (decision.action !== "open-pr") {
            console.error(decision.reason);
            process.exit(1);
          }
          console.log(decision.reason);
          EOF

      - name: Install and test the InstaBox adapter
        id: tests
        if: success() && steps.merge.outputs.state == 'clean'
        run: |
          pnpm install --frozen-lockfile
          pnpm exec vitest run server/instabox.test.ts server/instabox-retention.test.ts server/routes/instabox.test.ts src/components/InstaboxComputersCard.test.ts src/components/CloudBackendPicker.test.ts

      - name: Drop the merge if tests failed
        if: failure() && steps.merge.outputs.state == 'clean'
        run: |
          git merge --abort || true
          echo "::error::Tests failed. The merge was not pushed and nothing was installed."
          exit 1

      - name: Commit and open a review pull request
        if: success() && steps.merge.outputs.state == 'clean'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.merge.outputs.branch }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Merge upstream main, keeping the InstaBox adapter"
          git push --no-force origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" --title "Review upstream sync (InstaBox retained)" --body "$(cat <<'EOF'
          ## Summary
          - Merges `milind-soni/OpenMausBot` `main` into this fork.
          - The InstaBox create-guard and the fork updater feed were still present, and the InstaBox tests passed.
          - This pull request is for review. It does not merge itself, publish a release, or install a build.

          ## Rollback
          Close this pull request. `main` is unchanged until someone merges it. Do not force-push.
          EOF
          )"
